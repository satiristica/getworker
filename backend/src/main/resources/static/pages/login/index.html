<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>SILKWAY TRANSIT | LOGIN</title>
    <link rel="stylesheet" href="styles.css" type="text/css">
    <script src="./app.js?v=1" defer></script>
</head>

<body>
    <main class="pageBox">
        <div class="loginBox">
            <div class="imageBox">
                <img src="images/loginBox2.png" alt="a logo of the company">
            </div>

            <h1>Welcome Back!</h1>
            <p id="myP1">AUTHORIZE TO ACCESS THE DIRECTORY</p>

            <form id="loginForm">

                <div class="field">
                    <label>USERNAME</label>
                    <input id="username" type="text">
                </div>

                <div class="field">
                    <label>PASSWORD</label>
                    <input id="password" type="password">
                </div>

                <button>SUBMIT</button>
            </form>
        </div>
    </main>
</body>
</html>
