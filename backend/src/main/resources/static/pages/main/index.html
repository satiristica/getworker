<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Directory</title>

    <link rel="stylesheet" href="styles.css?v=2" type="text/css">
    <script src="./app.js?v=3" defer></script>
</head>


<body class="mainPage">
    <header class="myHead">
        <div class="company">
            <img
                class="Logo"
                src="../login/images/loginBox2.png"
                alt="SILKWAY TRANSIT"
            >
        </div>
    </header>

    <main class="directoryContent">
        <h1 id="myH1">DIRECTORY</h1>

        <div class="searchBox">
            <input
                id="employeeSearch"
                type="search"
                placeholder="SEARCH EMPLOYEES"
                autocomplete="off"
            >

            <p id="employeeCount">0 EMPLOYEES</p>
        </div>

        <table id="myTable">
            <thead>
                <tr>
                    <th>NAME</th>
                    <th>SURNAME</th>
                    <th>PHONE NUMBER</th>
                    <th>EMAIL</th>
                </tr>
            </thead>

            <tbody id="employeeLines">
            </tbody>
        </table>
    </main>
</body>
</html>
